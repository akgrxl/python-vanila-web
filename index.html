<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla Python Web App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Welcome to Your Vanilla Python Web App</h1>
        <p>This is a simple web application built with vanilla Python using the built-in http.server module.</p>
        <button onclick="showMessage()">Click Me!</button>
        <div id="message"></div>
    </div>

    <script>
        function showMessage() {
            document.getElementById('message').innerHTML = '<p>Hello from vanilla JavaScript!</p>';
        }
    </script>
</body>
</html>
